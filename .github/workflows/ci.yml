name: CI Quality Gate & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality (Format & Clippy & Host Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Check Host Target (cargo check)
        run: cargo check --target x86_64-unknown-linux-gnu

      - name: Run Host Tests (via PowerShell test_host.ps1)
        shell: pwsh
        run: ./test_host.ps1

      - name: Clippy Lint Check (Blocking)
        run: cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

  kernel-build:
    name: Bare-Metal Kernel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Type-check Kernel (no_std / x86_64-minos)
        run: |
          cargo check \
            --target x86_64-minos.json \
            -Zbuild-std=core,alloc \
            -Zbuild-std-features=compiler-builtins-mem

      - name: Build Kernel (Release)
        run: cargo build --release

  qemu-integration:
    name: QEMU Integration Test (Net Self-Test + USB HID)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Install QEMU
        run: choco install qemu -y

      - name: Run QEMU Integration Test
        # -UsbHid -NoPs2: xHCI + usb-kbd/usb-mouse yolu QMP enjeksiyonuyla
        # uçtan uca doğrulanır; ARP TX dahil tüm NET-TEST kalıpları denetlenir.
        shell: pwsh
        run: ./test_qemu.ps1 -UsbHid -NoPs2 -TimeoutSeconds 300

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-integration-report
          path: |
            test-report.md
            target/qemu_serial.log
            target/qemu_audio.wav
          if-no-files-found: warn
          retention-days: 30


