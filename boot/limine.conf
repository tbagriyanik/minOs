timeout: 10

/MinOS (1280x720 Graphical Mode)
    protocol: linux
    kernel_path: boot():/boot/linux/vmlinuz
    module_path: boot():/boot/linux/initramfs.img
    cmdline: init=/init vga=792 quiet splash

/MinOS - 1024x768
    protocol: linux
    kernel_path: boot():/boot/linux/vmlinuz
    module_path: boot():/boot/linux/initramfs.img
    cmdline: init=/init vga=791 quiet splash

/MinOS - 800x600
    protocol: linux
    kernel_path: boot():/boot/linux/vmlinuz
    module_path: boot():/boot/linux/initramfs.img
    cmdline: init=/init vga=788 quiet splash

/MinOS - 1920x1080 (Full HD)
    protocol: linux
    kernel_path: boot():/boot/linux/vmlinuz
    module_path: boot():/boot/linux/initramfs.img
    cmdline: init=/init video=1920x1080 quiet splash

/MinOS Standalone (Microkernel Mode)
    protocol: limine
    kernel_path: boot():/boot/minos-kernel
