TIMEOUT=10

:MinOS Live CD (Graphical Desktop)
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/minos-kernel
    RESOLUTION=1280x720x32

:Boot Installed MinOS from Hard Disk (HDD/SSD)
    PROTOCOL=limine
    KERNEL_PATH=hdd(1:1):/boot/minos-kernel
    RESOLUTION=1280x720x32

:One-Click Install MinOS to Hard Disk
    PROTOCOL=linux
    KERNEL_PATH=boot:///boot/linux/vmlinuz
    MODULE_PATH=boot:///boot/linux/initramfs.img
    CMDLINE=modloop=/boot/linux/modloop-virt apkovl=localhost.apkovl.tar.gz alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v3.20/main autoloop quiet

:MinOS Live CD - 1920x1080 (Full HD)
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/minos-kernel
    RESOLUTION=1920x1080x32

:MinOS Live CD - 1024x768
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/minos-kernel
    RESOLUTION=1024x768x32

:MinOS Live CD - 800x600
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/minos-kernel
    RESOLUTION=800x600x32
