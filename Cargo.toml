[package]
name = "minos-kernel"
version = "2.1.0"
edition = "2021"

[features]
boot-log = []
exfat = []

[dependencies]
# Allocator for no_std environment
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
webpki-roots = { version = "1.0.11", default-features = false }

[build-dependencies]
fontdue = "0.9.4"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
overflow-checks = false
