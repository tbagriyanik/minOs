timeout: 10

/MinOS Live CD (Graphical Desktop)
    protocol: limine
    kernel_path: boot():/boot/minos-kernel
    resolution: 1280x720x32

/Install MinOS to Disk (Linux Hardware Installer)
    protocol: linux
    kernel_path: boot():/boot/linux/vmlinuz
    module_path: boot():/boot/linux/initramfs.img
    cmdline: alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v3.20/main autoloop quiet

