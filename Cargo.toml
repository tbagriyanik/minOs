[package]
name = "minos-kernel"
version = "1.6.0"
edition = "2021"

[features]
boot-log = []

[dependencies]
# Allocator for no_std environment
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[build-dependencies]
fontdue = "0.9.4"


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
overflow-checks = false

