name: CI Quality Gate & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host Tests (Crypto, Allocator, TLS, JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Host Tests
        run: |
          cargo test --test host_tests --test host_allocator_tests --test host_crypto_tests

  kernel-check:
    name: Bare-Metal Kernel Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Type-check Kernel (no_std / x86_64-minos)
        run: |
          cargo check \
            --target x86_64-minos.json \
            -Zbuild-std=core,alloc \
            -Zbuild-std-features=compiler-builtins-mem

      - name: Build Kernel (Release)
        run: cargo build --release

  iso-smoke-build:
    name: ISO Packaging & Integrity
    needs: [host-tests, kernel-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install ISO Creation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools build-essential git
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 /tmp/limine
          make -C /tmp/limine limine
          sudo cp /tmp/limine/limine /usr/local/bin/

      - name: Build Kernel Release
        run: cargo build --release

      - name: Package ISO
        run: |
          mkdir -p target/iso_root/boot/limine
          mkdir -p target/iso_root/EFI/BOOT

          cp boot/limine.conf target/iso_root/boot/limine/limine.conf 2>/dev/null || true
          cp boot/limine.conf target/iso_root/limine.conf 2>/dev/null || true
          cp boot/limine.conf target/iso_root/EFI/BOOT/limine.conf 2>/dev/null || true
          cp boot/cat_small.png target/iso_root/boot/cat_small.png 2>/dev/null || true

          cp boot/limine/limine-bios-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-bios.sys target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-uefi-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/BOOTX64.EFI target/iso_root/EFI/BOOT/BOOTX64.EFI 2>/dev/null || true
          cp boot/limine/BOOTIA32.EFI target/iso_root/EFI/BOOT/BOOTIA32.EFI 2>/dev/null || true

          cp target/x86_64-minos/release/minos-kernel target/iso_root/boot/minos-kernel

          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin -efi-boot-part --efi-boot-image --protective-msdos-label \
            -o minos.iso target/iso_root

          limine bios-install minos.iso
          test -s minos.iso

