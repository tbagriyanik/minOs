name: Release Build & Deploy ISO

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    name: Build MinOS ISO Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install ISO Creation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools

      - name: Build MinOS Kernel (Release)
        run: cargo build --release

      - name: Create Bootable ISO (using xorriso & Limine)
        run: |
          mkdir -p target/iso_root/boot/limine
          mkdir -p target/iso_root/EFI/BOOT
          
          cp boot/limine.cfg target/iso_root/boot/limine/limine.cfg 2>/dev/null || true
          cp boot/limine.cfg target/iso_root/limine.cfg 2>/dev/null || true
          cp boot/limine/limine-bios-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-uefi-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-bios.sys target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-bios.sys target/iso_root/limine-bios.sys 2>/dev/null || true
          cp boot/EFI/BOOT/BOOTX64.EFI target/iso_root/EFI/BOOT/ 2>/dev/null || true
          
          cp target/x86_64-minos/release/minos-kernel target/iso_root/boot/minos-kernel
          
          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -o minos.iso target/iso_root
            
          mkdir -p target/release
          cp minos.iso target/release/minos.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minos-iso
          path: minos.iso

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: minos.iso
          name: MinOS Release ${{ github.ref_name }}
          body: |
            🐾 **MinOS (Cat Edition) Bootable ISO Release**
            
            - **Kernel Version:** 64-Bit (`x86_64`) Long Mode
            - **Bootloader:** Limine v8 (El Torito / UEFI)
            - **Display:** 1280x720 32-bit Framebuffer (Double Buffered)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
