name: CI Quality Gate & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality (Format & Clippy & Host Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Check Host Target (cargo check)
        run: cargo check --target x86_64-unknown-linux-gnu

      - name: Run Host Tests (via PowerShell test_host.ps1)
        shell: pwsh
        run: ./test_host.ps1

      - name: Clippy Lint Check (Blocking)
        run: cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

  kernel-build:
    name: Bare-Metal Kernel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Type-check Kernel (no_std / x86_64-minos)
        run: |
          cargo check \
            --target x86_64-minos.json \
            -Zbuild-std=core,alloc \
            -Zbuild-std-features=compiler-builtins-mem

      - name: Build Kernel (Release)
        run: cargo build --release

  qemu-boot-test:
    name: QEMU ISO Boot (${{ matrix.profile }})
    needs: [code-quality, kernel-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Varsayılan, çok düşük donanım ve yüksek donanım profilleri.
          - profile: default
            memory: 512M
            cpus: 2
          - profile: minimal
            memory: 128M
            cpus: 1
          - profile: high
            memory: 8G
            cpus: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install ISO Creation & QEMU Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools build-essential git qemu-system-x86

          # Limine utility
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 /tmp/limine
          make -C /tmp/limine limine
          sudo cp /tmp/limine/limine /usr/local/bin/

      - name: Build Kernel Release
        run: cargo build --release

      - name: Create Bootable ISO
        run: |
          mkdir -p target/iso_root/boot/limine
          mkdir -p target/iso_root/EFI/BOOT

          cp boot/limine.conf target/iso_root/boot/limine/limine.conf 2>/dev/null || true
          cp boot/limine.conf target/iso_root/limine.conf 2>/dev/null || true
          cp boot/limine.conf target/iso_root/EFI/BOOT/limine.conf 2>/dev/null || true
          cp boot/cat_small.png target/iso_root/boot/cat_small.png 2>/dev/null || true

          cp boot/limine/limine-bios-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-bios.sys target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-uefi-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/BOOTX64.EFI target/iso_root/EFI/BOOT/BOOTX64.EFI 2>/dev/null || true
          cp boot/limine/BOOTIA32.EFI target/iso_root/EFI/BOOT/BOOTIA32.EFI 2>/dev/null || true

          cp target/x86_64-minos/release/minos-kernel target/iso_root/boot/minos-kernel

          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin -efi-boot-part --efi-boot-image --protective-msdos-label \
            -o minos.iso target/iso_root

          limine bios-install minos.iso
          test -s minos.iso

      - name: Run QEMU Headless Boot Test (15s Timeout)
        run: |
          echo "Starting QEMU test (profile: ${{ matrix.profile }}, memory: ${{ matrix.memory }}, cpus: ${{ matrix.cpus }})..."
          set +e
          timeout 15s qemu-system-x86_64 \
            -cdrom minos.iso \
            -m ${{ matrix.memory }} \
            -smp ${{ matrix.cpus }} \
            -display none \
            -serial file:serial.log \
            -no-reboot
          qemu_status=$?
          set -e
          # A live kernel is expected to hit the timeout; any other QEMU
          # failure is a real CI failure.
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            exit "$qemu_status"
          fi

          echo "--- QEMU SERIAL OUTPUT (TAIL) ---"
          cat serial.log || true

          echo "Verifying critical boot marker in serial log..."
          if grep -q "\[BOOT\] CRITICAL_CHECKS_COMPLETE" serial.log; then
            echo "[OK] Found: [BOOT] CRITICAL_CHECKS_COMPLETE"
          else
            echo "[FAIL] Critical boot marker was not found in serial.log"
            exit 1
          fi

          echo "Verifying P1 isolation and lifecycle checks..."
          for marker in \
            "[P1] CR3 ayri ve kernel mapping Ring3'e kapali: BASARILI" \
            "[P1] process kaynak temizligi: BASARILI"; do
            if grep -Fq "$marker" serial.log; then
              echo "[OK] Found: $marker"
            else
              echo "[FAIL] Missing: $marker"
              exit 1
            fi
          done

  qemu-live-net-test:
    name: QEMU Live Network Test (HTTP/TLS/H2/Brotli)
    needs: [kernel-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install ISO Creation & QEMU Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools build-essential git qemu-system-x86 python3
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 /tmp/limine
          make -C /tmp/limine limine
          sudo cp /tmp/limine/limine /usr/local/bin/
          # / ucu Accept-Encoding: br gordugunde Brotli govde dondurur.
          pip3 install brotli || true

      - name: Build Kernel Release
        run: cargo build --release

      - name: Create Bootable ISO (livetest cmdline)
        run: |
          mkdir -p target/iso_root/boot/limine
          mkdir -p target/iso_root/EFI/BOOT

          # Ilk boot girdisine livetest token'lari ekle: host uzerindeki
          # Python sunucusu (HTTP/1.1 + Brotli) ve gercek bir HTTPS site
          # (TLS + HTTP/2 ALPN).
          sed '0,/kernel_cmdline: live full/s//kernel_cmdline: live full livetest=http:\/\/10.0.2.2:8000\/ livetest_tls=https:\/\/github.com\//' \
            boot/limine.conf > target/iso_root/limine.conf
          cp target/iso_root/limine.conf target/iso_root/boot/limine/limine.conf
          cp target/iso_root/limine.conf target/iso_root/EFI/BOOT/limine.conf
          cp boot/cat_small.png target/iso_root/boot/cat_small.png 2>/dev/null || true

          cp boot/limine/limine-bios-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-bios.sys target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-uefi-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/BOOTX64.EFI target/iso_root/EFI/BOOT/BOOTX64.EFI 2>/dev/null || true
          cp boot/limine/BOOTIA32.EFI target/iso_root/EFI/BOOT/BOOTIA32.EFI 2>/dev/null || true

          cp target/x86_64-minos/release/minos-kernel target/iso_root/boot/minos-kernel

          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin -efi-boot-part --efi-boot-image --protective-msdos-label \
            -o minos.iso target/iso_root
          limine bios-install minos.iso

      - name: Start Host HTTP Test Server & Run QEMU
        run: |
          python3 tools/live_net_test_server.py --port 8000 &
          SERVER_PID=$!
          sleep 1
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          set +e
          timeout 25s qemu-system-x86_64 \
            -cdrom minos.iso \
            -m 512M \
            -smp 2 \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -display none \
            -serial file:serial.log \
            -no-reboot
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            exit "$qemu_status"
          fi

          echo "--- LIVE-TEST SERIAL OUTPUT ---"
          grep "LIVE-TEST\|NET-TEST" serial.log || true

          # Zorunlu: canli test bolumu calisti ve boot tamamlandi.
          if ! grep -q "\[LIVE-TEST\]" serial.log; then
            echo "[FAIL] LIVE-TEST bolumu serial logda yok"
            exit 1
          fi
          if ! grep -q "\[BOOT\] CRITICAL_CHECKS_COMPLETE" serial.log; then
            echo "[FAIL] Boot tamamlanamadi"
            exit 1
          fi
          # HTTP/1.1 + Brotli host sunucusundan gercek yanit alindi.
          if ! grep -Eq "\[LIVE-TEST\] 1\. HTTP/1\.1 GET\.\.\. durum=2" serial.log; then
            echo "[FAIL] Host sunucusundan HTTP yaniti alinamadi"
            exit 1
          fi
          echo "[OK] Canli ag testleri calisti (HTTP+Brotli dogrulandi; TLS/H2 sonucu logda)"
