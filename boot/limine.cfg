TIMEOUT=5

:minOs Live Environment
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/minos-kernel
    KERNEL_CMDLINE=live
    RESOLUTION=1280x720x32

:minOs Installed System
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/minos-kernel
    KERNEL_CMDLINE=installed
    RESOLUTION=1280x720x32

:Display Resolutions
    ::800x600 (SVGA)
        PROTOCOL=limine
        KERNEL_PATH=boot:///boot/minos-kernel
        RESOLUTION=800x600x32

    ::1024x768 (XGA)
        PROTOCOL=limine
        KERNEL_PATH=boot:///boot/minos-kernel
        RESOLUTION=1024x768x32

    ::1280x720 (HD 720p)
        PROTOCOL=limine
        KERNEL_PATH=boot:///boot/minos-kernel
        RESOLUTION=1280x720x32

    ::1920x1080 (Full HD 1080p)
        PROTOCOL=limine
        KERNEL_PATH=boot:///boot/minos-kernel
        RESOLUTION=1920x1080x32
