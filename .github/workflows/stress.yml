name: Long-Running Stress & Leak Tests

# Duzenli calisan uzun sureli scheduler / bellek sizintisi denetimi.
# test_stress_24h.ps1 QEMU altinda sistemi calistirir, seri akista panik
# imzalarini ve (test_qemu.ps1 kaliplari uzerinden) sizinti raporlarini
# toplar. GitHub-hosted kosucularda is suresi 6 saat ile sinirli oldugundan
# tam 24 saatlik kosu icin self-hosted kosucu gerekir; buradaki varsayilan
# 4 saatlik nightly koso her gun tekrarlanir.

on:
  schedule:
    - cron: "23 2 * * *" # her gun 02:23 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Stres suresi (saat)"
        required: false
        default: "4"
      fps3d:
        description: "FPS 3D is yuku ekle"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  stress:
    name: Scheduler & Memory Stress (${{ github.event.inputs.hours || '4' }}h)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Install QEMU
        run: choco install qemu -y

      - name: Run Long-Running Stress Test
        shell: pwsh
        env:
          STRESS_HOURS: ${{ github.event.inputs.hours || '4' }}
          STRESS_FPS3D: ${{ github.event.inputs.fps3d || 'true' }}
        run: |
          $args = @("-Hours", $env:STRESS_HOURS)
          if ($env:STRESS_FPS3D -eq "true") { $args += "-Fps3d" }
          ./test_stress_24h.ps1 @args

      - name: Upload Stress Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ github.run_id }}
          path: |
            target/stress_report.txt
            target/stress_serial.log
            target/stress_audio.wav
          if-no-files-found: warn
          retention-days: 90
