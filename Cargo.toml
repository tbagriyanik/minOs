[package]
name = "minos-kernel"
version = "1.0.0"
edition = "2021"

[dependencies]
# Allocator for no_std environment
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[build-dependencies]
fontdue = "0.9.4"


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3

