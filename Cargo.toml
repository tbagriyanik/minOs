[package]
name = "minos-kernel"
version = "2.2.0"
edition = "2021"

[features]
boot-log = []
# exFAT read/write support — disabled by default due to Microsoft patent considerations.
# Enable with: cargo build --features exfat
exfat = []

[dependencies]
# Allocator for no_std environment
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
webpki-roots = { version = "1.0.11", default-features = false }
rand_hc = { version = "0.5.1", default-features = false }
rand_core = { version = "0.10.0", default-features = false }
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "proto-ipv4", "proto-ipv6", "socket-dhcpv4", "socket-dns", "socket-tcp", "socket-udp"] }
bitflags = { version = "2.10.0", default-features = false }
heapless = { version = "0.9.3", default-features = false }
zerocopy = { version = "0.8.27", default-features = false, features = ["derive"] }
crc32fast = { version = "1.5.0", default-features = false }
elf = { version = "0.8.0", default-features = false }
embedded-io = { version = "0.6.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["heapless"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
acpi = { version = "6.1.1", default-features = false }
raw-cpuid = { version = "11.6.0", default-features = false }
log = { version = "0.4.29", default-features = false }

[build-dependencies]
fontdue = "0.9.4"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
overflow-checks = false
