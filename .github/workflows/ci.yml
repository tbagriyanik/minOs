name: CI Quality Gate & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality (Format & Clippy & Host Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable & Components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all -- --check || true

      - name: Run Host Tests (via PowerShell test_host.ps1)
        shell: pwsh
        run: ./test_host.ps1

      - name: Clippy Lint Check (Warnings only, non-blocking)
        run: cargo clippy --target x86_64-unknown-linux-gnu || cargo clippy || true

  kernel-build:
    name: Bare-Metal Kernel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Type-check Kernel (no_std / x86_64-minos)
        run: |
          cargo check \
            --target x86_64-minos.json \
            -Zbuild-std=core,alloc \
            -Zbuild-std-features=compiler-builtins-mem

      - name: Build Kernel (Release)
        run: cargo build --release

  qemu-boot-test:
    name: QEMU ISO Boot (${{ matrix.profile }})
    needs: [code-quality, kernel-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Varsayılan, çok düşük donanım ve yüksek donanım profilleri.
          - profile: default
            memory: 512M
            cpus: 2
          - profile: minimal
            memory: 128M
            cpus: 1
          - profile: high
            memory: 8G
            cpus: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly & Components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install ISO Creation & QEMU Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools build-essential git qemu-system-x86

          # Limine utility
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 /tmp/limine
          make -C /tmp/limine limine
          sudo cp /tmp/limine/limine /usr/local/bin/

      - name: Build Kernel Release
        run: cargo build --release

      - name: Create Bootable ISO
        run: |
          mkdir -p target/iso_root/boot/limine
          mkdir -p target/iso_root/EFI/BOOT

          cp boot/limine.conf target/iso_root/boot/limine/limine.conf 2>/dev/null || true
          cp boot/limine.conf target/iso_root/limine.conf 2>/dev/null || true
          cp boot/limine.conf target/iso_root/EFI/BOOT/limine.conf 2>/dev/null || true
          cp boot/cat_small.png target/iso_root/boot/cat_small.png 2>/dev/null || true

          cp boot/limine/limine-bios-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-bios.sys target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/limine-uefi-cd.bin target/iso_root/boot/limine/ 2>/dev/null || true
          cp boot/limine/BOOTX64.EFI target/iso_root/EFI/BOOT/BOOTX64.EFI 2>/dev/null || true
          cp boot/limine/BOOTIA32.EFI target/iso_root/EFI/BOOT/BOOTIA32.EFI 2>/dev/null || true

          cp target/x86_64-minos/release/minos-kernel target/iso_root/boot/minos-kernel

          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin -efi-boot-part --efi-boot-image --protective-msdos-label \
            -o minos.iso target/iso_root

          limine bios-install minos.iso
          test -s minos.iso

      - name: Run QEMU Headless Boot Test (15s Timeout)
        run: |
          echo "Starting QEMU test (profile: ${{ matrix.profile }}, memory: ${{ matrix.memory }}, cpus: ${{ matrix.cpus }})..."
          timeout 15s qemu-system-x86_64 \
            -cdrom minos.iso \
            -m ${{ matrix.memory }} \
            -smp ${{ matrix.cpus }} \
            -display none \
            -serial file:serial.log \
            -no-reboot || true

          echo "--- QEMU SERIAL OUTPUT (TAIL) ---"
          cat serial.log || true

          echo "Verifying critical boot marker in serial log..."
          if grep -q "\[BOOT\] CRITICAL_CHECKS_COMPLETE" serial.log; then
            echo "[OK] Found: [BOOT] CRITICAL_CHECKS_COMPLETE"
          else
            echo "[FAIL] Critical boot marker was not found in serial.log"
            exit 1
          fi
