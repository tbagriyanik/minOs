[package]
name = "host-browser"
version = "2.1.0"
edition = "2021"

[dependencies]
# no_std alloc for kernel target
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[lib]
# no_std library for kernel integration
path = "src/lib.rs"

[[bin]]
name = "host-browser"
path = "src/main.rs"

# host-browser devre dışı bırakıldı (Minos için gerekli değil)
# Kod silinmedi, yalnızca [workspace] kaldırıldı.
